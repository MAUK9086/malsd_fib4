paths:
  data_raw: data/raw
  data_processed: data
  results: results
  models: models
  logs: logs

thresholds:
  # FibroScan LSM (kPa)
  lsm_significant_fibrosis: 8.0
  lsm_advanced_fibrosis: 12.0
  # FIB-4 cutoffs (AASLD 2023)
  fib4_low: 1.30
  fib4_high: 2.67
  # CAP steatosis (dB/m)
  cap_steatosis: 274
  # BMI obesity cutoffs
  asian_bmi_cutoff: 23.0
  standard_bmi_cutoff: 25.0
  # Metabolic syndrome components
  fasting_glucose_cutoff: 100       # mg/dL
  triglycerides_cutoff: 150         # mg/dL
  hdl_men_cutoff: 40                # mg/dL
  hdl_women_cutoff: 50              # mg/dL
  systolic_bp_cutoff: 130           # mmHg
  diastolic_bp_cutoff: 85           # mmHg
  # Asian central adiposity (cm)
  waist_asian_men: 90
  waist_asian_women: 80
  # Western central adiposity (NCEP-ATP III)
  waist_western_men: 102
  waist_western_women: 88
  # GGT elevated thresholds (for Blindspot Score)
  ggt_elevated_men: 36
  ggt_elevated_women: 25
  # Alcohol exclusion (drinks/day)
  alcohol_men_cutoff: 2.14
  alcohol_women_cutoff: 1.43
  # LUX quality
  lux_iqr_ratio_max: 30             # %
  lux_min_measures: 10
  # LLM validation
  llm_concordance_threshold: 0.40
  inter_model_similarity_threshold: 0.75
  # Clustering
  min_false_negatives_for_subgroup_clustering: 50

models:
  primary_name: qwen2.5-32b
  primary_path: models/qwen2.5-32b-instruct-q4_k_m.gguf
  secondary_name: llama-3.1-70b
  secondary_path: models/Meta-Llama-3.1-70B-Instruct-Q4_K_M.gguf
  n_gpu_layers_32b: -1     # Full GPU for 32B
  n_gpu_layers_70b: 25     # Partial offload for 70B on 24 GB
  n_ctx: 4096
  temperature: 0.0
  seed: 42
  max_tokens: 512
  repeat_penalty: 1.1
  n_threads: 8

nhanes:
  base_url: "https://wwwn.cdc.gov/Nchs/Nhanes/2017-2018"
  # Files to download: [preferred_name, fallback_suffix]
  files:
    - [P_LUX, LUX_J]
    - [P_BIOPRO, BIOPRO_J]
    - [P_CBC, CBC_J]
    - [P_GHB, GHB_J]
    - [P_DEMO, DEMO_J]
    - [P_BMX, BMX_J]
    - [P_DIQ, DIQ_J]
    - [P_ALQ, ALQ_J]
    - [P_HEQ, HEQ_J]
    - [P_TRIGLY, TRIGLY_J]
    - [P_HDL, HDL_J]
    - [P_TCHOL, TCHOL_J]
    - [P_BPX, BPX_J]
    - [P_BPQ, BPQ_J]
    - [P_SMQ, SMQ_J]

xgboost:
  n_trials: 50
  cv_folds: 5
  test_size: 0.20
  random_state: 42

clustering:
  umap_n_neighbors: 10
  umap_min_dist: 0.05
  umap_random_state: 42
  hdbscan_min_cluster_sizes: [3, 5, 7, 10, 15, 20]
  kmeans_k_range: [2, 3, 4, 5, 6, 7, 8, 9, 10]

bootstrap:
  n_iterations: 1000
  random_state: 42

sentence_transformer_model: all-MiniLM-L6-v2

ast_uln: 40  # U/L — used in APRI calculation
